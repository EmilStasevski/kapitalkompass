name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Free disk space (CUDA torch wheels are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install
        run: uv sync --frozen
      - name: Lint (ruff, format, mypy)
        run: uv run task lint
      - name: Generate the seeded synthetic bank
        run: uv run task data:synth
      - name: Check the generator is deterministic
        run: git diff --exit-code data/synthetic/HASHES
      - name: Tests (CPU subset; no GPU, no LLM server, no regulatory PDFs)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: uv run task test:ci
