version: "3"

vars:
  PY: uv run python

tasks:
  setup:
    desc: Install deps and git hooks
    cmds:
      - uv sync
      - uv run pre-commit install

  data:rates:
    desc: Refresh the ECB rate-curve cache (network)
    cmds:
      - "{{.PY}} -m kapitalkompass.data.rates"

  data:synth:
    desc: Generate the seeded synthetic bank
    cmds:
      - "{{.PY}} -m kapitalkompass.data.synth"

  lint:
    desc: ruff + mypy
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy

  format:
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Unit and analytic cross-check tests (CPU subset unless GPU present)
    cmds:
      - uv run pytest -q -m "not llm" {{.CLI_ARGS}}

  pipeline:
    desc: Dagster job - modules 1-5, drift monitor, hypothesis experiments; logs MLflow runs, writes results/
    cmds:
      - "{{.PY}} -m kapitalkompass.mlops.pipeline"

  dagster:ui:
    desc: Dagster UI for the pipeline job
    cmds:
      - uv run dagster dev -m kapitalkompass.mlops.pipeline

  mlflow:ui:
    desc: MLflow UI over the local run store
    cmds:
      - uv run mlflow ui --backend-store-uri sqlite:///mlruns/mlflow.db

  mlops:repro:
    desc: Compare the last two MLflow runs per module with the same data hash
    cmds:
      - "{{.PY}} -m kapitalkompass.mlops.tracking"

  bench:
    desc: Module 1 benchmark numpy vs numba vs torch CPU vs CUDA (stop LLM server first)
    cmds:
      - "{{.PY}} -m kapitalkompass.credit.bench"

  data:regs:
    desc: Check the pinned regulatory PDFs for the RAG corpus (sha256 in config/corpus.yaml)
    cmds:
      - "{{.PY}} -c \"from kapitalkompass.agent.corpus import build_chunks; print(len(build_chunks()), 'chunks, hashes ok')\""

  agent:index:
    desc: Chunk the corpus and build the LanceDB index with bge-m3 (needs Ollama)
    cmds:
      - "{{.PY}} -m kapitalkompass.agent.run index"

  agent:demo:
    desc: Agent writes the demo Vorstandsvorlage to reports/vorstandsvorlage.md (needs Ollama)
    cmds:
      - "{{.PY}} -m kapitalkompass.agent.run demo"

  agent:eval:
    desc: Run the 60-question eval and score it deterministically (needs Ollama, ~25 min)
    cmds:
      - "{{.PY}} -m kapitalkompass.agent.run eval"

  agent:heldout:
    desc: Run the 20 pre-registered held-out questions (hypothesis H4; needs Ollama)
    cmds:
      - "{{.PY}} -m kapitalkompass.agent.run heldout"

  mcp:
    desc: Serve the five agent tools over MCP (stdio)
    cmds:
      - "{{.PY}} -m kapitalkompass.agent.mcp_server"

  report:
    desc: Rebuild README tables, README.de.md, reports/ (Markdown, figures, PDF) and docs/hypotheses.md from results/
    cmds:
      - "{{.PY}} -m kapitalkompass.report.run"

  test:ci:
    desc: CPU-only test subset used in CI (no GPU, no LLM, no regulatory PDFs)
    cmds:
      - uv run pytest -q -m "not llm and not gpu" {{.CLI_ARGS}}
