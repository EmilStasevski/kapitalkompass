# Module 7: MLOps. Experiment tracking, drift monitoring, pipeline orchestration.
seed: 20261124

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db   # relative to the repo root; mlruns/ is git-ignored
  artifact_root: mlruns/artifacts
  experiment: kapitalkompass

drift:
  # Monitoring batches of new loans are compared with a reference sample of the current book.
  reference_size: 5000
  batch_size: 2000
  batches_per_severity: 20
  columns: [sector, grade, pd, lgd, ead_eur, maturity_years, client_margin]
  categorical: [sector, grade]
  drift_share: 0.3              # dataset drift if >= 30% of columns drift (Evidently rule)
  # Injected real-estate stress. Per unit of severity:
  shock:
    sector: real_estate
    downgrade_prob: 0.6         # each real-estate loan moves one grade down (max grade 4)
    lgd_uplift: 0.4             # LGD * (1 + 0.4), clipped to the generator bounds
    margin_add: 0.005           # repricing: client margin + 50 bp
    extra_share: 0.10           # new-business mix: real-estate share + 10 points
  severities: {none: 0.0, mild: 0.33, medium: 0.67, strong: 1.0}

experiments:
  granularity:
    large_scale: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
    scenarios: 1000000
  shrinkage:
    replications: 20
    seed0: 70000
    warmup: 300
    samples: 300
