[project]
name = "kapitalkompass"
version = "0.1.0"
description = "Gesamtbanksteuerung prototype: credit portfolio capital, ALM/liquidity, RAROC, limits, optimiser, audited LLM agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "polars>=1.20",
    "pandera[polars]>=0.22",
    "pyarrow>=18",
    "httpx>=0.28",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "go-task-bin>=3.40",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kapitalkompass"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs CUDA",
    "slow: long-running",
    "llm: needs local LLM server",
]
addopts = "-ra"
