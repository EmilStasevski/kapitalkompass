# Model parameters (not data-generation). Documented in reports and docs/decisions.md.
seed: 7

credit:
  scenarios: 2000000          # pipeline run; benchmark uses its own sizes
  chunk_scenarios: 16384      # per GPU chunk
  obligor_block: 12000        # obligors per inner block (bounds memory < 6 GB)
  confidence: 0.999
  copula: gaussian            # main run
  t_nu: 6                     # t-copula sensitivity run
  t_scenarios: 1000000
  # Asset correlation: obligor X_i = sqrt(rho_s) Z_s + sqrt(1 - rho_s) eps_i,
  # Z_s = sqrt(w) G + sqrt(1 - w) S_s  => corr(Z_s, Z_t) = w for s != t.
  sector_rho:
    manufacturing: 0.16
    trade: 0.14
    real_estate: 0.20
  global_weight: 0.55

bayes:
  # Sector-level prior centres for the average-grade PD (logit scale). Destatis publishes
  # insolvency counts but no sector rates were retrievable (decision 16): these centres are
  # stated assumptions with a wide prior sd.
  sector_prior_pd: {manufacturing: 0.008, trade: 0.010, real_estate: 0.005}
  sector_prior_sd: 0.75
  chains: 2
  warmup: 1000
  samples: 1000
  credible: 0.90                 # two-sided interval; conservative PD = upper bound
  conformal_confidence: 0.90
